version: 2
project_name: calliope

builds:
  - id: calliope
    main: ./cmd/calliope
    binary: calliope
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/Calliope-AI/calliope-cli/internal/version.Version={{.Version}}
      - -X github.com/Calliope-AI/calliope-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/Calliope-AI/calliope-cli/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    # El nombre está acoplado a install.sh, que reconstruye este mismo nombre
    # a mano ("calliope_${version#v}_${so}_${arco}.tar.gz": sistema en
    # minúsculas, arquitectura literal, versión sin «v»). Tocar esta plantilla
    # obliga a tocar install.sh a la vez, y viceversa. No se deja en el valor
    # por defecto de GoReleaser: aunque hoy coincide (ver informe de la Task
    # 21), ese valor por defecto ha cambiado de versión en versión de la
    # herramienta y el workflow usa `version: latest`.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

nfpms:
  - formats: [deb, rpm, apk]
    maintainer: Calliope Data
    description: CLI de Calliope Data
    license: Proprietary

# Homebrew se publica como *cask*, no como formula: GoReleaser 2.18 marcó
# `brews:` como deprecado para binarios precompilados como este.
# Ojo: un cask es solo macOS. En Linux la vía son install.sh y los paquetes
# deb/rpm/apk que declara nfpms.
homebrew_casks:
  - name: calliope
    repository:
      owner: Calliope-AI
      name: homebrew-tap
      # GITHUB_TOKEN (el de por defecto en el workflow) no tiene permiso de
      # escritura sobre Calliope-AI/homebrew-tap: hace falta el token dedicado.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    binaries: [calliope]
    description: CLI de Calliope Data
    homepage: https://github.com/Calliope-AI/calliope-cli
    hooks:
      post:
        # El binario no va firmado ni notarizado, así que Gatekeeper lo pone
        # en cuarentena al descargarlo y macOS se niega a ejecutarlo. Esto la
        # retira en la instalación; quítalo el día que se firme el binario.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/calliope"]
          end

scoops:
  - repository:
      owner: Calliope-AI
      name: scoop-bucket
      # Mismo motivo que en brews[].repository.token: GITHUB_TOKEN no puede
      # escribir en Calliope-AI/scoop-bucket.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    description: CLI de Calliope Data

release:
  draft: false
